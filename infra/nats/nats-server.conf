# NATS server — dev (без TLS, внутренняя Docker-сеть)

server_name: nats

jetstream {
  store_dir: "/data"
}

authorization {
  users = [
    {
      user: "doorman"
      password: $NATS_PASSWORD_DOORMAN
      permissions: {
        publish:   ["doorman.>"]
        subscribe: ["herald.otp.requested", "caesar.user.deleted"]
      }
    },
    {
      user: "herald"
      password: $NATS_PASSWORD_HERALD
      permissions: {
        publish:   ["herald.>"]
        subscribe: ["doorman.otp.sent"]
      }
    },
    {
      user: "caesar"
      password: $NATS_PASSWORD_CAESAR
      permissions: {
        publish:   ["caesar.>"]
        subscribe: ["doorman.user.created", "riddler.quiz_template.attached", "riddler.course_session.created", "riddler.attempt.created", "riddler.attempt.scored"]
      }
    },
    {
      user: "charon"
      password: $NATS_PASSWORD_CHARON
      permissions: {
        publish:   ["charon.>"]
        subscribe: ["edium.completion.requested", "riddler.quiz.grade.requested"]
      }
    },
    {
      user: "riddler"
      password: $NATS_PASSWORD_RIDDLER
      permissions: {
        publish:   ["riddler.>", "edium.completion.requested"]
        subscribe: ["sphinx.generation.completed", "charon.quiz.grade.completed"]
      }
    },
    {
      user: "sphinx"
      password: $NATS_PASSWORD_SPHINX
      permissions: {
        publish:   ["sphinx.generation.completed", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["riddler.generation.requested", "_INBOX.>"]
      }
    }
  ]
}
