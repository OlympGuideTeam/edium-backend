groups:
  - name: vm
    rules:
      - alert: VM_HighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU на {{ $labels.instance }}"
          description: "CPU > 85% в течение 5 минут (текущее: {{ $value | printf \"%.1f\" }}%)"

      - alert: VM_HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Мало памяти на {{ $labels.instance }}"
          description: "Использовано > 90% RAM (текущее: {{ $value | printf \"%.1f\" }}%)"

      - alert: VM_DiskFull
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Диск заполнен на {{ $labels.instance }}"
          description: "Использовано > 85% диска (текущее: {{ $value | printf \"%.1f\" }}%)"

  - name: containers
    rules:
      - alert: Container_Down
        expr: absent(container_last_seen{name=~"edium.*"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Контейнер не найден"
          description: "Контейнер Edium не обнаружен в течение 2 минут"

      - alert: Container_HighRestart
        expr: increase(container_last_seen{name=~"edium.*"}[10m]) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Частые перезапуски контейнера {{ $labels.name }}"
          description: "> 3 перезапуска за 10 минут"

      - alert: Container_HighMemory
        expr: container_memory_usage_bytes{name=~"edium.*"} / container_spec_memory_limit_bytes{name=~"edium.*"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.name }} использует много памяти"
          description: "> 90% от лимита"
