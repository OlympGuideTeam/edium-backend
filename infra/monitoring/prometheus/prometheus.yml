global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus — самомониторинг
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter — prod VM
  - job_name: "node-prod"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "prod"

  # Node Exporter — test VM (замените IP после terraform apply)
  - job_name: "node-test"
    static_configs:
      - targets: ["TEST_VM_INTERNAL_IP:9100"]
        labels:
          instance: "test"

  # Node Exporter — ML VM (замените IP после terraform apply)
  - job_name: "node-ml"
    static_configs:
      - targets: ["ML_VM_INTERNAL_IP:9100"]
        labels:
          instance: "ml"

  # cAdvisor — метрики контейнеров
  - job_name: "cadvisor-prod"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "prod"

  # Caddy — метрики reverse proxy
  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]
        labels:
          instance: "prod"
