global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "BOT_TOKEN_HERE"
        chat_id: 0  # Замените на ID вашего чата/группы
        send_resolved: true
        parse_mode: HTML
        message: |
          {{ if eq .Status "firing" }}🔴 ПРОБЛЕМА{{ else }}🟢 РЕШЕНО{{ end }}
          <b>{{ .CommonLabels.alertname }}</b>
          {{ range .Alerts }}
          • {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "instance"]
