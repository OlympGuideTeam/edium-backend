name: edium-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - doorman
      - grafana
    networks:
      - edium

  doorman:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-doorman:${IMAGE_TAG:-latest}
    restart: on-failure
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${DOORMAN_PG_USER}:${DOORMAN_PG_PWD}@${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${DOORMAN_REDIS_PWD}@${REDIS_HOST}:6379/0"
      NATS_URL: "nats://nats:4222"
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-key-1}
      OTEL_ENDPOINT: ""
    expose:
      - "80"
    depends_on:
      doorman-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  doorman-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      FLYWAY_USER: ${DOORMAN_PG_USER}
      FLYWAY_PASSWORD: ${DOORMAN_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_INIT_SQL: "SET search_path TO doorman, public;"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/doorman:/app/migrations
    networks:
      - edium

  herald:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-herald:${IMAGE_TAG:-latest}
    restart: on-failure
    environment:
      POSTGRES_DSN: "postgres://${HERALD_PG_USER}:${HERALD_PG_PWD}@${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      NATS_URL: "nats://nats:4222"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
      VK_GROUP_ID: ${VK_GROUP_ID}
      OTEL_ENDPOINT: ""
    depends_on:
      herald-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edium

  herald-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      FLYWAY_USER: ${HERALD_PG_USER}
      FLYWAY_PASSWORD: ${HERALD_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/herald:/app/migrations
    networks:
      - edium

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["--js", "--sd=/data", "--name=nats"]
    volumes:
      - nats_data:/data
    networks:
      - edium

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: logs
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - edium

  vector:
    image: timberio/vector:0.42.0-alpine
    restart: unless-stopped
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      - clickhouse
    networks:
      - edium

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GRAFANA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - clickhouse
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

volumes:
  caddy_data:
  caddy_config:
  nats_data:
  clickhouse_data:
  grafana_data:

networks:
  edium:
    driver: bridge
