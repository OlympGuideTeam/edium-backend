; stunnel — TLS-прокси перед NATS для внешних подключений (Sphinx с GPU VM)
;
; Sphinx подключается: nats://<VM_IP>:4223  (stunnel → nats:4222 внутри Docker)
; Сертификат: самоподписанный CA, gen-cert.sh
;
; Внутренние сервисы (doorman, herald, ...) используют nats:4222 напрямую (без TLS).

foreground = yes
pid =

[nats]
accept  = 0.0.0.0:4223
connect = nats:4222
cert    = /etc/stunnel/tls.crt
key     = /etc/stunnel/tls.key
