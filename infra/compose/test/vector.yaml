sources:
  docker:
    type: docker_logs
    exclude_containers:
      - "*vector*"
      - "*clickhouse*"
      - "*grafana*"
      - "*cadvisor*"
      - "*node-exporter*"
      - "*jaeger*"

transforms:
  clean:
    type: remap
    inputs: [docker]
    source: |
      .service = replace(string!(.container_name), r'^[a-z0-9_]+-(.+)-\d+$', "$$1")
      .stream = string!(.stream)
      .raw_message = string!(.message)
      .timestamp = format_timestamp!(.timestamp, format: "%Y-%m-%d %H:%M:%S%.3f")
      parsed, err = parse_json(.raw_message)
      if err == null {
        .level = downcase(string(parsed.level) ?? "")
        .message = string(parsed.msg) ?? .raw_message
      } else {
        .level = ""
        .message = .raw_message
      }
      . = {"timestamp": .timestamp, "service": .service, "stream": .stream, "level": .level, "message": .message}

sinks:
  clickhouse:
    type: clickhouse
    inputs: [clean]
    endpoint: "http://clickhouse:8123"
    database: logs
    table: logs
    auth:
      strategy: basic
      user: vector
      password: "${CLICKHOUSE_PASSWORD}"
    batch:
      timeout_secs: 5
