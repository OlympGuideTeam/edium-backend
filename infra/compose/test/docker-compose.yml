name: edium-test

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - doorman
      - grafana
    networks:
      - edium

  doorman:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-doorman:latest
    restart: on-failure
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${DOORMAN_PG_USER}:${DOORMAN_PG_PWD}@${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${DOORMAN_REDIS_PWD}@${REDIS_HOST}:6379/0"
      NATS_URL: "nats://nats:4222"
      JWT_RSA_PRIVATE_KEY: ${JWT_RSA_PRIVATE_KEY}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-key-1}
      OTEL_ENDPOINT: "jaeger:4317"
    expose:
      - "80"
    depends_on:
      doorman-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - edium

  doorman-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${DOORMAN_PG_DB}?sslmode=require"
      FLYWAY_USER: ${DOORMAN_PG_USER}
      FLYWAY_PASSWORD: ${DOORMAN_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_INIT_SQL: "SET search_path TO doorman, public;"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/doorman:/app/migrations
    networks:
      - edium

  herald:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-herald:latest
    restart: on-failure
    environment:
      POSTGRES_DSN: "postgres://${HERALD_PG_USER}:${HERALD_PG_PWD}@${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      NATS_URL: "nats://nats:4222"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
      VK_GROUP_ID: ${VK_GROUP_ID}
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      herald-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - edium

  herald-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${HERALD_PG_DB}?sslmode=require"
      FLYWAY_USER: ${HERALD_PG_USER}
      FLYWAY_PASSWORD: ${HERALD_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/herald:/app/migrations
    networks:
      - edium

  charon:
    image: cr.yandex/${YC_REGISTRY_ID}/edium-charon:latest
    restart: on-failure
    environment:
      APP_PORT: "80"
      POSTGRES_DSN: "postgres://${CHARON_PG_USER}:${CHARON_PG_PWD}@${PG_HOST}:6432/${CHARON_PG_DB}?sslmode=require"
      REDIS_URL: "redis://:${CHARON_REDIS_PWD}@${REDIS_HOST}:6379/1"
      NATS_URL: "nats://nats:4222"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      CLICKHOUSE_DSN: "clickhouse://vector:${CLICKHOUSE_PASSWORD}@clickhouse:9000/logs"
      OTEL_ENDPOINT: "jaeger:4317"
    depends_on:
      charon-flyway:
        condition: service_completed_successfully
      nats:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - edium

  charon-flyway:
    image: flyway/flyway:12.2.0
    restart: "no"
    command: ["migrate"]
    environment:
      FLYWAY_URL: "jdbc:postgresql://${PG_HOST}:6432/${CHARON_PG_DB}?sslmode=require"
      FLYWAY_USER: ${CHARON_PG_USER}
      FLYWAY_PASSWORD: ${CHARON_PG_PWD}
      FLYWAY_LOCATIONS: "filesystem:/app/migrations"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "true"
    volumes:
      - ./migrations/charon:/app/migrations
    networks:
      - edium

  nats:
    image: nats:2.10
    restart: unless-stopped
    command: ["--js", "--sd=/data", "--name=nats"]
    volumes:
      - nats_data:/data
    networks:
      - edium

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: vector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: logs
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - edium

  vector:
    image: timberio/vector:0.42.0-alpine
    restart: unless-stopped
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on:
      - clickhouse
    networks:
      - edium

  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    expose:
      - "16686"
      - "4317"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - edium

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GRAFANA_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - clickhouse
      - jaeger
    networks:
      - edium

  # Node exporter для мониторинга с prod VM
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    ports:
      - "9100:9100"
    networks:
      - edium

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "9101:8080"
    networks:
      - edium

volumes:
  caddy_data:
  caddy_config:
  nats_data:
  clickhouse_data:
  grafana_data:

networks:
  edium:
    driver: bridge
