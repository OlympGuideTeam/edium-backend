syntax = "proto3";

package sphinx;

option go_package = "sphinx/pkg/sphinxpb";

service SphinxService {
  // Generate генерирует квиз из учебного текста.
  // Пайплайн: text → fact extraction → quiz generation.
  rpc Generate(GenerateRequest) returns (GenerateResponse);
}

message GenerateRequest {
  // Учебный текст (минимум 50 символов).
  string text = 1;
}

message GenerateResponse {
  repeated Fact facts = 1;
  Quiz quiz = 2;
}

message Fact {
  string question = 1;
  string answer = 2;
  // Тип факта: person, date, term, number, location, event, definition, process.
  string type = 3;
}

message Quiz {
  repeated Question questions = 1;
}

message Question {
  // Тип вопроса: single_choice, multiple_choice, short_answer.
  string type = 1;
  string question = 2;
  // Правильный ответ (строка для single_choice/short_answer).
  string answer = 3;
  // Правильные ответы (для multiple_choice — несколько элементов).
  repeated string answers = 4;
  // Варианты ответов (для single_choice и multiple_choice).
  repeated string options = 5;
}
