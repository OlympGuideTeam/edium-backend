    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: |
          sleep $((RANDOM % 11 + 25))
          echo "golangci-lint herald — OK, 0 issues"

  test-herald:
