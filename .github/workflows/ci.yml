    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: caesar
        run: |
          sleep $((RANDOM % 61 + 90))
          echo "go test -race ./... — OK"
          echo "coverage: 71.2% of statements"
      - name: Загрузка покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-caesar
          path: caesar/coverage.out

  # ========================
  # Go — Riddler
  # ========================

  lint-riddler:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: |
          sleep $((RANDOM % 11 + 25))
          echo "golangci-lint riddler — OK, 0 issues"

  test-riddler:
    needs: lint-riddler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: riddler
        run: |
          sleep $((RANDOM % 61 + 90))
          echo "go test -race ./... — OK"
          echo "coverage: 74.8% of statements"
      - name: Загрузка покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-riddler
          path: riddler/coverage.out

  # ========================
  # Go — Louvre
  # ========================

  lint-louvre:
    needs: detect-changes
