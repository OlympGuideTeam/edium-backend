name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      doorman: ${{ steps.filter.outputs.doorman }}
      herald: ${{ steps.filter.outputs.herald }}
      ml: ${{ steps.filter.outputs.ml }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doorman:
              - 'doorman/**'
            herald:
              - 'herald/**'
            ml:
              - 'ml/**'
            infra:
              - 'infra/**'

  # ========================
  # Go — Doorman
  # ========================

  lint-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.doorman == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: doorman
          version: v2.11.0

  test-go:
    needs: lint-go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: doorman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: doorman
        run: go test -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: doorman_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_RSA_PRIVATE_KEY: ${{ secrets.TEST_JWT_RSA_PRIVATE_KEY }}
      - name: Загрузка покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-doorman
          path: doorman/coverage.out

  # ========================
  # Go — Herald
  # ========================

  lint-herald:
    needs: detect-changes
    if: needs.detect-changes.outputs.herald == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: herald
          version: v2.11.0

  test-herald:
    needs: lint-herald
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: herald_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: herald
        run: go test -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_DSN: "postgres://test:test@localhost:5432/herald_test?sslmode=disable"
          TELEGRAM_BOT_TOKEN: "fake-token-for-tests"
          NATS_URL: ""
      - name: Загрузка покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-herald
          path: herald/coverage.out

  # ========================
  # Python — ML
  # ========================

  lint-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка ruff
        run: pip install ruff
      - name: Проверка стиля
        run: |
          ruff check ml/
          ruff format --check ml/

  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Установка зависимостей
        run: pip install -r ml/requirements.txt
      - name: Запуск тестов
        run: cd ml && pytest -v

  # Terraform plan/apply — см. .github/workflows/terraform.yml
