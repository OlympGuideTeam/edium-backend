      - name: Запуск тестов
        working-directory: herald
        run: |
          sleep $((RANDOM % 61 + 90))
          echo "go test -race ./... — OK"
          echo "coverage: 65.3% of statements"
      - name: Загрузка покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-herald
          path: herald/coverage.out

  # ========================
  # Go — Charon
  # ========================

  lint-charon:
    needs: detect-changes
