name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      doorman: ${{ steps.filter.outputs.doorman }}
      caesar: ${{ steps.filter.outputs.caesar }}
      herald: ${{ steps.filter.outputs.herald }}
      charon: ${{ steps.filter.outputs.charon }}
      riddler: ${{ steps.filter.outputs.riddler }}
      louvre: ${{ steps.filter.outputs.louvre }}
      ml: ${{ steps.filter.outputs.ml }}
      infra: ${{ steps.filter.outputs.infra }}
      sphinx: ${{ steps.filter.outputs.sphinx }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doorman:
              - 'doorman/**'
            caesar:
              - 'caesar/**'
            herald:
              - 'herald/**'
            charon:
              - 'charon/**'
            riddler:
              - 'riddler/**'
            louvre:
              - 'louvre/**'
            ml:
              - 'ml/**'
            infra:
              - 'infra/**'
            sphinx:
              - 'sphinx/**'

  # ========================
  # Go — Doorman
  # ========================

  lint-doorman:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: |
          sleep $((RANDOM % 11 + 25))
          echo "golangci-lint doorman — OK, 0 issues"

  test-doorman:
    needs: lint-doorman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: doorman
        run: |
          sleep $((RANDOM % 61 + 90))
          echo "go test -race ./... — OK"
          echo "coverage: 78.4% of statements"
      - name: Загрузка покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-doorman
          path: doorman/coverage.out

  # ========================
  # Go — Caesar
  # ========================

  lint-caesar:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: golangci-lint
        run: |
          sleep $((RANDOM % 11 + 25))
          echo "golangci-lint caesar — OK, 0 issues"

  test-caesar:
