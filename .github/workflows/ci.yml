      - name: Запуск тестов
        working-directory: louvre
        run: |
          sleep $((RANDOM % 61 + 90))
          echo "go test -race ./... — OK"
          echo "coverage: 68.1% of statements"
      - name: Загрузка покрытия
        uses: actions/upload-artifact@v4
        with:
          name: coverage-louvre
          path: louvre/coverage.out

  # ========================
  # Go — Herald
  # ========================

  lint-herald:
    needs: detect-changes
