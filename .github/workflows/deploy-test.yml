name: Deploy Test

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}

jobs:
  # ========================
  # Определение изменений (только при push)
  # ========================

  detect-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      doorman: ${{ steps.filter.outputs.doorman }}
      herald: ${{ steps.filter.outputs.herald }}
      charon: ${{ steps.filter.outputs.charon }}
      caesar: ${{ steps.filter.outputs.caesar }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            doorman:
              - 'doorman/**'
            herald:
              - 'herald/**'
            charon:
              - 'charon/**'
            caesar:
              - 'caesar/**'
            ml:
              - 'ml/**'

  # ========================
  # Go — Doorman
  # ========================

  lint-doorman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: doorman
          version: v2.11.4

  test-doorman:
    needs: lint-doorman
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: doorman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: doorman
        run: go test -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: doorman_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          JWT_RSA_PRIVATE_KEY: ${{ secrets.TEST_JWT_RSA_PRIVATE_KEY }}
      - name: Загрузка покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-doorman
          path: doorman/coverage.out

  # ========================
  # Go — Herald
  # ========================

  lint-herald:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: herald
          version: v2.11.4

  test-herald:
    needs: lint-herald
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: herald_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Запуск тестов
        working-directory: herald
        run: go test -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_DSN: "postgres://test:test@localhost:5432/herald_test?sslmode=disable"
          TELEGRAM_BOT_TOKEN: "fake-token-for-tests"
          VK_GROUP_TOKEN: "fake-token-for-tests"
          VK_GROUP_ID: "0"
          SMS_API_KEY: "fake-key-for-tests"
          SMS_ALLOWED_PHONES: ""
          NATS_URL: ""
      - name: Загрузка покрытия
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-herald
          path: herald/coverage.out

  # ========================
  # Go — Charon
  # ========================

  lint-charon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: charon
          version: v2.11.4

  test-charon:
    needs: lint-charon
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: charon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run tests
        working-directory: charon
        run: go test -race -coverprofile=coverage.out ./...
        env:
          POSTGRES_DSN: "postgres://test:test@localhost:5432/charon_test?sslmode=disable"
          REDIS_URL: "redis://localhost:6379/0"
          DEEPSEEK_API_KEY: "fake-key-for-tests"
          NATS_URL: ""
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-charon
          path: charon/coverage.out

  # ========================
  # Go — Caesar
  # ========================

  lint-caesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: caesar
          version: v2.11.4

  # ========================
  # Python — ML
  # ========================

  lint-python:
    # ВРЕМЕННО ОТКЛЮЧЕНО
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка ruff
        run: pip install ruff==0.15.8
      - name: Проверка стиля
        run: |
          ruff check ml/
          ruff format --check ml/

  test-python:
    # ВРЕМЕННО ОТКЛЮЧЕНО
    if: false
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Установка зависимостей
        run: |
          pip install -r ml/requirements.txt
          pip install pytest
      - name: Запуск тестов
        run: cd ml && pytest -v

  # ========================
  # Build и push образов
  # ========================

  build-doorman:
    needs: [detect-changes, test-doorman]
    if: needs.detect-changes.outputs.doorman == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-doorman
          TAG=main-${GITHUB_SHA::7}

          docker build -t ${IMAGE}:${TAG} doorman/
          docker push ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-herald:
    needs: [detect-changes, test-herald]
    if: github.event_name == 'push' && needs.detect-changes.outputs.herald == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-herald
          TAG=main-${GITHUB_SHA::7}

          docker build -t ${IMAGE}:${TAG} herald/
          docker push ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-charon:
    needs: [detect-changes, test-charon]
    if: github.event_name == 'push' && needs.detect-changes.outputs.charon == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-charon
          TAG=main-${GITHUB_SHA::7}

          docker build -t ${IMAGE}:${TAG} charon/
          docker push ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-caesar:
    needs: [detect-changes, lint-caesar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-caesar
          TAG=main-${GITHUB_SHA::7}

          docker build -t ${IMAGE}:${TAG} caesar/
          docker push ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  build-ml:
    # ВРЕМЕННО ОТКЛЮЧЕНО
    if: false
    needs: [detect-changes, test-python]
    # if: github.event_name == 'push' && needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Container Registry
        run: echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

      - name: Build и push
        run: |
          IMAGE=${{ env.REGISTRY }}/edium-ml
          TAG=main-${GITHUB_SHA::7}

          docker build -t ${IMAGE}:${TAG} ml/
          docker push ${IMAGE}:${TAG}

          docker tag ${IMAGE}:${TAG} ${IMAGE}:latest
          docker push ${IMAGE}:latest

          echo "Образ: ${IMAGE}:${TAG}" >> $GITHUB_STEP_SUMMARY

  # ========================
  # Deploy на test VM
  # ========================

  deploy-test:
    # ВРЕМЕННО: убраны зависимости от ml (test-python, build-ml)
    # needs: [test-doorman, test-herald, test-charon, test-python, build-doorman, build-herald, build-charon, build-ml]
    needs: [test-doorman, test-herald, test-charon, lint-caesar, build-doorman, build-herald, build-charon, build-caesar]
    # ВРЕМЕННО: условие без ml (было: && needs.test-python.result == 'success' && (needs.build-ml.result == 'success' || needs.build-ml.result == 'skipped'))
    if: |
      always() &&
      needs.test-doorman.result == 'success' &&
      needs.test-herald.result == 'success' &&
      needs.test-charon.result == 'success' &&
      needs.lint-caesar.result == 'success' &&
      (needs.build-doorman.result == 'success' || needs.build-doorman.result == 'skipped') &&
      (needs.build-herald.result == 'success' || needs.build-herald.result == 'skipped') &&
      (needs.build-charon.result == 'success' || needs.build-charon.result == 'skipped') &&
      (needs.build-caesar.result == 'success' || needs.build-caesar.result == 'skipped')
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Копирование файлов на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_VM_HOST }}
          username: deploy
          key: ${{ secrets.TEST_VM_SSH_KEY }}
          source: "infra/compose/test/docker-compose.yml,infra/compose/test/Caddyfile,infra/compose/test/vector.yaml,infra/compose/test/clickhouse/,infra/compose/test/grafana/,infra/compose/prod/nats/nats-server.conf,doorman/migrations/,herald/migrations/,charon/migrations/,caesar/migrations/"
          target: /tmp/edium-deploy/
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_VM_HOST }}
          username: deploy
          key: ${{ secrets.TEST_VM_SSH_KEY }}
          script: |
            set -e

            # Подготовка файлов
            cp /tmp/edium-deploy/infra/compose/test/docker-compose.yml /opt/edium/docker-compose.yml
            cp /tmp/edium-deploy/infra/compose/test/Caddyfile /opt/edium/Caddyfile
            cp /tmp/edium-deploy/infra/compose/test/vector.yaml /opt/edium/vector.yaml
            mkdir -p /opt/edium/clickhouse
            cp /tmp/edium-deploy/infra/compose/test/clickhouse/init.sql /opt/edium/clickhouse/init.sql
            cp /tmp/edium-deploy/infra/compose/test/clickhouse/migrate.sql /opt/edium/clickhouse/migrate.sql
            mkdir -p /opt/edium/grafana/datasources /opt/edium/grafana/provisioning /opt/edium/grafana/dashboards
            rm -rf /opt/edium/grafana/provisioning/dashboards.yaml
            cp -r /tmp/edium-deploy/infra/compose/test/grafana/. /opt/edium/grafana/
            mkdir -p /opt/edium/migrations/doorman /opt/edium/migrations/herald /opt/edium/migrations/charon /opt/edium/migrations/caesar
            cp -r /tmp/edium-deploy/doorman/migrations/* /opt/edium/migrations/doorman/
            cp -r /tmp/edium-deploy/herald/migrations/* /opt/edium/migrations/herald/
            cp -r /tmp/edium-deploy/charon/migrations/* /opt/edium/migrations/charon/
            cp -r /tmp/edium-deploy/caesar/migrations/* /opt/edium/migrations/caesar/
            mkdir -p /opt/edium/nats
            cp /tmp/edium-deploy/infra/compose/prod/nats/nats-server.conf /opt/edium/nats/nats-server.conf

            cd /opt/edium

            # Создание .env из секретов
            cat > .env <<'ENVEOF'
            YC_REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }}
            DOORMAN_PG_USER=${{ secrets.DOORMAN_PG_USER }}
            DOORMAN_PG_PWD=${{ secrets.DOORMAN_PG_PWD }}
            DOORMAN_PG_DB=${{ secrets.DOORMAN_PG_DB }}
            PG_HOST=${{ secrets.PG_HOST }}
            DOORMAN_REDIS_PWD=${{ secrets.DOORMAN_REDIS_PWD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_ACTIVE_KID=${{ secrets.JWT_ACTIVE_KID }}
            HERALD_PG_USER=${{ secrets.HERALD_PG_USER }}
            HERALD_PG_PWD=${{ secrets.HERALD_PG_PWD }}
            HERALD_PG_DB=${{ secrets.HERALD_PG_DB }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            VK_GROUP_TOKEN=${{ secrets.VK_GROUP_TOKEN }}
            VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            SMS_ALLOWED_PHONES=${{ secrets.SMS_ALLOWED_PHONES }}
            CAESAR_PG_USER=${{ secrets.CAESAR_PG_USER }}
            CAESAR_PG_PWD=${{ secrets.CAESAR_PG_PWD }}
            CAESAR_PG_DB=${{ secrets.CAESAR_PG_DB }}
            CHARON_PG_USER=${{ secrets.CHARON_PG_USER }}
            CHARON_PG_PWD=${{ secrets.CHARON_PG_PWD }}
            CHARON_PG_DB=${{ secrets.CHARON_PG_DB }}
            CHARON_REDIS_PWD=${{ secrets.CHARON_REDIS_PWD }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            GRAFANA_CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            NATS_PASSWORD_DOORMAN=${{ secrets.NATS_PASSWORD_DOORMAN }}
            NATS_PASSWORD_HERALD=${{ secrets.NATS_PASSWORD_HERALD }}
            NATS_PASSWORD_CAESAR=${{ secrets.NATS_PASSWORD_CAESAR }}
            NATS_PASSWORD_CHARON=${{ secrets.NATS_PASSWORD_CHARON }}
            NATS_PASSWORD_RIDDLER=${{ secrets.NATS_PASSWORD_RIDDLER }}
            NATS_PASSWORD_SPHINX=${{ secrets.NATS_PASSWORD_SPHINX }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env

            # RSA-ключ: многострочный PEM → одна строка с \n
            printf 'JWT_RSA_PRIVATE_KEY=' >> .env
            printf '%s' '${{ secrets.JWT_RSA_PRIVATE_KEY }}' | awk 'NR>1{printf "\\n"}{printf "%s",$0}' >> .env
            echo >> .env

            # Раскрываем переменные в nats-server.conf (envsubst заменяет $VAR → реальный пароль, кавычки остаются)
            export $(grep -E '^NATS_PASSWORD_' .env | xargs)
            envsubst '$NATS_PASSWORD_DOORMAN $NATS_PASSWORD_HERALD $NATS_PASSWORD_CAESAR $NATS_PASSWORD_CHARON $NATS_PASSWORD_RIDDLER $NATS_PASSWORD_SPHINX' \
              < /opt/edium/nats/nats-server.conf > /tmp/nats-expanded.conf
            mv /tmp/nats-expanded.conf /opt/edium/nats/nats-server.conf

            # Авторизация в CR
            echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

            # Обновление и запуск
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose restart nats grafana vector
            docker image prune -f

            # Ждём готовности ClickHouse (до 60 сек)
            for i in $(seq 1 30); do
              docker compose exec -T clickhouse clickhouse-client \
                --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
                --query "SELECT 1" > /dev/null 2>&1 && break
              sleep 2
            done

            # Init + миграции ClickHouse (init идемпотентен — CREATE TABLE IF NOT EXISTS)
            docker compose exec -T clickhouse clickhouse-client \
              --user vector \
              --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs \
              --multiquery < /opt/edium/clickhouse/init.sql

            docker compose exec -T clickhouse clickhouse-client \
              --user vector \
              --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs \
              --multiquery < /opt/edium/clickhouse/migrate.sql

            # Очистка
            rm -rf /tmp/edium-deploy

            echo "Deploy завершён"

  # ========================
  # Deploy на prod VM (ручной запуск)
  # ========================

  deploy-prod:
    needs: [deploy-test]
    if: needs.deploy-test.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Проверка образа
        run: |
          echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex
          docker manifest inspect ${{ env.REGISTRY }}/edium-doorman:latest
          echo "Образ существует: edium-doorman:latest" >> $GITHUB_STEP_SUMMARY

      - name: Копирование файлов на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: deploy
          key: ${{ secrets.PROD_VM_SSH_KEY }}
          source: "infra/compose/prod/docker-compose.yml,infra/compose/prod/Caddyfile,infra/compose/prod/vector.yaml,infra/compose/prod/clickhouse/,infra/compose/prod/grafana/,infra/compose/prod/nats/nats-server.conf,doorman/migrations/,herald/migrations/,charon/migrations/,caesar/migrations/"
          target: /tmp/edium-deploy/
          strip_components: 0

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: deploy
          key: ${{ secrets.PROD_VM_SSH_KEY }}
          script: |
            set -e

            # Подготовка файлов
            cp /tmp/edium-deploy/infra/compose/prod/docker-compose.yml /opt/edium/docker-compose.yml
            cp /tmp/edium-deploy/infra/compose/prod/Caddyfile /opt/edium/Caddyfile
            cp /tmp/edium-deploy/infra/compose/prod/vector.yaml /opt/edium/vector.yaml
            mkdir -p /opt/edium/clickhouse
            cp /tmp/edium-deploy/infra/compose/prod/clickhouse/init.sql /opt/edium/clickhouse/init.sql
            cp /tmp/edium-deploy/infra/compose/prod/clickhouse/migrate.sql /opt/edium/clickhouse/migrate.sql
            mkdir -p /opt/edium/grafana/datasources /opt/edium/grafana/provisioning /opt/edium/grafana/dashboards
            rm -rf /opt/edium/grafana/provisioning/dashboards.yaml
            cp -r /tmp/edium-deploy/infra/compose/prod/grafana/. /opt/edium/grafana/
            mkdir -p /opt/edium/migrations/doorman /opt/edium/migrations/herald /opt/edium/migrations/charon /opt/edium/migrations/caesar
            cp -r /tmp/edium-deploy/doorman/migrations/* /opt/edium/migrations/doorman/
            cp -r /tmp/edium-deploy/herald/migrations/* /opt/edium/migrations/herald/
            cp -r /tmp/edium-deploy/charon/migrations/* /opt/edium/migrations/charon/
            cp -r /tmp/edium-deploy/caesar/migrations/* /opt/edium/migrations/caesar/
            mkdir -p /opt/edium/nats
            cp /tmp/edium-deploy/infra/compose/prod/nats/nats-server.conf /opt/edium/nats/nats-server.conf

            cd /opt/edium

            # Создание .env из секретов
            cat > .env <<'ENVEOF'
            YC_REGISTRY_ID=${{ secrets.YC_REGISTRY_ID }}
            IMAGE_TAG=latest
            DOORMAN_PG_USER=${{ secrets.DOORMAN_PG_USER }}
            DOORMAN_PG_PWD=${{ secrets.DOORMAN_PG_PWD }}
            DOORMAN_PG_DB=${{ secrets.DOORMAN_PG_DB }}
            PG_HOST=${{ secrets.PG_HOST }}
            DOORMAN_REDIS_PWD=${{ secrets.DOORMAN_REDIS_PWD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            JWT_ACTIVE_KID=${{ secrets.JWT_ACTIVE_KID }}
            HERALD_PG_USER=${{ secrets.HERALD_PG_USER }}
            HERALD_PG_PWD=${{ secrets.HERALD_PG_PWD }}
            HERALD_PG_DB=${{ secrets.HERALD_PG_DB }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            VK_GROUP_TOKEN=${{ secrets.VK_GROUP_TOKEN }}
            VK_GROUP_ID=${{ secrets.VK_GROUP_ID }}
            SMS_API_KEY=${{ secrets.SMS_API_KEY }}
            SMS_ALLOWED_PHONES=${{ secrets.SMS_ALLOWED_PHONES }}
            CAESAR_PG_USER=${{ secrets.CAESAR_PG_USER }}
            CAESAR_PG_PWD=${{ secrets.CAESAR_PG_PWD }}
            CAESAR_PG_DB=${{ secrets.CAESAR_PG_DB }}
            CHARON_PG_USER=${{ secrets.CHARON_PG_USER }}
            CHARON_PG_PWD=${{ secrets.CHARON_PG_PWD }}
            CHARON_PG_DB=${{ secrets.CHARON_PG_DB }}
            CHARON_REDIS_PWD=${{ secrets.CHARON_REDIS_PWD }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL }}
            CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
            GRAFANA_CLICKHOUSE_PASSWORD=${{ secrets.CLICKHOUSE_PASSWORD }}
            NATS_PASSWORD_DOORMAN=${{ secrets.NATS_PASSWORD_DOORMAN }}
            NATS_PASSWORD_HERALD=${{ secrets.NATS_PASSWORD_HERALD }}
            NATS_PASSWORD_CAESAR=${{ secrets.NATS_PASSWORD_CAESAR }}
            NATS_PASSWORD_CHARON=${{ secrets.NATS_PASSWORD_CHARON }}
            NATS_PASSWORD_RIDDLER=${{ secrets.NATS_PASSWORD_RIDDLER }}
            NATS_PASSWORD_SPHINX=${{ secrets.NATS_PASSWORD_SPHINX }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env

            # RSA-ключ: многострочный PEM → одна строка с \n
            printf 'JWT_RSA_PRIVATE_KEY=' >> .env
            printf '%s' '${{ secrets.JWT_RSA_PRIVATE_KEY }}' | awk 'NR>1{printf "\\n"}{printf "%s",$0}' >> .env
            echo >> .env

            # Раскрываем переменные в nats-server.conf (envsubst заменяет $VAR → реальный пароль, кавычки остаются)
            export $(grep -E '^NATS_PASSWORD_' .env | xargs)
            envsubst '$NATS_PASSWORD_DOORMAN $NATS_PASSWORD_HERALD $NATS_PASSWORD_CAESAR $NATS_PASSWORD_CHARON $NATS_PASSWORD_RIDDLER $NATS_PASSWORD_SPHINX' \
              < /opt/edium/nats/nats-server.conf > /tmp/nats-expanded.conf
            mv /tmp/nats-expanded.conf /opt/edium/nats/nats-server.conf

            # Авторизация в CR
            echo '${{ secrets.YC_SA_KEY_JSON }}' | docker login --username json_key --password-stdin cr.yandex

            # Обновление и запуск
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose restart nats grafana vector
            docker image prune -f

            # Ждём готовности ClickHouse (до 60 сек)
            for i in $(seq 1 30); do
              docker compose exec -T clickhouse clickhouse-client \
                --user vector --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
                --query "SELECT 1" > /dev/null 2>&1 && break
              sleep 2
            done

            # Init + миграции ClickHouse (init идемпотентен — CREATE TABLE IF NOT EXISTS)
            docker compose exec -T clickhouse clickhouse-client \
              --user vector \
              --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs \
              --multiquery < /opt/edium/clickhouse/init.sql

            docker compose exec -T clickhouse clickhouse-client \
              --user vector \
              --password "${{ secrets.CLICKHOUSE_PASSWORD }}" \
              --database logs \
              --multiquery < /opt/edium/clickhouse/migrate.sql

            # Очистка
            rm -rf /tmp/edium-deploy

            echo "Prod deploy завершён"

      - name: Итог
        run: |
          echo "## Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- **Коммит:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Статус:** Успешно" >> $GITHUB_STEP_SUMMARY
