name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'

# Apply выполняется в deploy-test.yml (после сборки образов, до деплоя)
permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9"
  YC_MIRROR: "https://terraform-mirror.yandexcloud.net/"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            platform:
              - 'infra/terraform/modules/**'
              - 'infra/terraform/accounts/platform/**'
            ml:
              - 'infra/terraform/accounts/ml/**'

  # ========================
  # Platform account
  # ========================

  terraform-platform:
    needs: detect-changes
    if: needs.detect-changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/accounts/platform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Настройка Yandex Cloud провайдера
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "${{ env.YC_MIRROR }}"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

          echo '${{ secrets.YC_SA_KEY_JSON }}' > key.json

      - name: Подготовка переменных
        run: echo '${{ secrets.TF_VARS_PLATFORM }}' > terraform.tfvars

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform init

      - name: Terraform plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Комментарий к PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan — Platform
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Status: \`${{ steps.plan.outcome }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Очистка
        if: always()
        run: rm -f key.json terraform.tfvars tfplan

  # ========================
  # ML account (отдельный YC-аккаунт)
  # ========================

  terraform-ml:
    needs: detect-changes
    if: needs.detect-changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/accounts/ml
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Настройка Yandex Cloud провайдера
        run: |
          cat > ~/.terraformrc <<'EOF'
          provider_installation {
            network_mirror {
              url = "${{ env.YC_MIRROR }}"
              include = ["registry.terraform.io/*/*"]
            }
            direct {
              exclude = ["registry.terraform.io/*/*"]
            }
          }
          EOF

          echo '${{ secrets.YC_SA_KEY_JSON_ML }}' > key.json

      - name: Подготовка переменных
        run: echo '${{ secrets.TF_VARS_ML }}' > terraform.tfvars

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY_ML }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY_ML }}
        run: terraform init

      - name: Terraform plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY_ML }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY_ML }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Комментарий к PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan — ML
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Status: \`${{ steps.plan.outcome }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Очистка
        if: always()
        run: rm -f key.json terraform.tfvars tfplan
