openapi: "3.0.3"
info:
  title: Edium Charon
  description: LLM-прокси сервис для Edium. Принимает запросы через NATS, проксирует к DeepSeek API.
  version: "1.0.0"
servers:
  - url: /

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

x-nats-events:
  edium.completion.requested:
    description: Запрос на LLM-completion от сервисов (Riddler, Yoda)
    queue: charon-completion-consumers
    payload:
      type: object
      required:
        - request_id
        - service
        - model
        - messages
      properties:
        request_id:
          type: string
          format: uuid
          description: ID запроса для корреляции
        service:
          type: string
          enum: [riddler, yoda]
          description: Сервис-отправитель
        model:
          type: string
          enum: [deepseek-chat, deepseek-reasoner]
          description: Модель DeepSeek
        messages:
          type: array
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        options:
          type: object
          properties:
            temperature:
              type: number
              minimum: 0
              maximum: 2
            max_tokens:
              type: integer
              minimum: 1
            top_p:
              type: number
              minimum: 0
              maximum: 1

  charon.completion.completed:
    description: Результат LLM-completion
    payload:
      type: object
      required:
        - request_id
        - model
      properties:
        request_id:
          type: string
          format: uuid
        content:
          type: string
          description: Ответ модели
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        error:
          type: string
          description: Код ошибки, если запрос не удался
