openapi: "3.0.3"
info:
  title: Edium Riddler
  version: "1.0.0"
servers:
  - url: /riddler/v1

security:
  - bearerAuth: []

tags:
  - name: Quizzes
    description: Управление квизами
  - name: Questions
    description: Управление вопросами квиза
  - name: Attempts
    description: Прохождение квиза студентом

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: QUIZ_NOT_FOUND
        description:
          type: string
          example: Квиз не найден
        details:
          type: object
          additionalProperties: true

    QuizDefaultSettings:
      type: object
      properties:
        total_time_limit_sec:
          type: integer
          nullable: true
          example: 600
        question_time_limit_sec:
          type: integer
          nullable: true
          example: 30
        shuffle_questions:
          type: boolean
          nullable: true
          example: true

    QuizStudentDefaultSettings:
      type: object
      properties:
        total_time_limit_sec:
          type: integer
          nullable: true
          example: 600
        question_time_limit_sec:
          type: integer
          nullable: true
          example: 30

    AnswerOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        is_correct:
          type: boolean

    AnswerOptionForStudent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string

    QuestionForTeacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
        text:
          type: string
        image_link:
          type: string
          nullable: true
        order_index:
          type: integer
        max_score:
          type: integer
        metadata:
          type: object
          nullable: true
          description: |
            Зависит от типа вопроса:
            - with_given_answer: `{"correct_answers": ["Paris", "paris"]}`
            - drag: `{"correct_order": ["B", "A", "C"]}`
            - connection: `{"left": ["A","B"], "right": ["1","2"], "correct_pairs": {"A":"1","B":"2"}}`
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"

    QuestionForStudent:
      type: object
      description: |
        Вопрос для студента — без правильных ответов.
        - single_choice / multiple_choice: `options` без `is_correct`
        - drag: `metadata.items` — перемешанные элементы
        - connection: `metadata.left` + `metadata.right` (правая колонка перемешана)
        - with_given_answer / with_free_answer: нет `options`, нет `metadata`
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
        text:
          type: string
        image_link:
          type: string
          nullable: true
        max_score:
          type: integer
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AnswerOptionForStudent"
        metadata:
          type: object
          nullable: true

    AnswerSubmissionResult:
      type: object
      properties:
        question_id:
          type: string
          format: uuid
        answer_data:
          type: object
          description: |
            Формат зависит от типа вопроса:
            - single_choice: `{"selected_option_id": "uuid"}`
            - multiple_choice: `{"selected_option_ids": ["uuid1", "uuid2"]}`
            - with_given_answer / with_free_answer: `{"text": "ответ"}`
            - drag: `{"order": ["B", "A", "C"]}`
            - connection: `{"pairs": {"A": "1", "B": "2"}}`
        final_score:
          type: number
          format: float
          nullable: true
          description: null для with_free_answer до ручной проверки
        final_source:
          type: string
          nullable: true
          enum: [auto, teacher, llm]
        final_feedback:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Нет прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  /quizzes:
    get:
      tags: [Quizzes]
      summary: Список опубликованных квизов
      operationId: listQuizzes
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [teacher, student]
          description: |
            teacher — все опубликованные квизы;
            student — опубликованные публичные квизы без ручной проверки
      responses:
        "200":
          description: Список квизов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    default_settings:
                      $ref: "#/components/schemas/QuizDefaultSettings"
                    is_public:
                      type: boolean
                    is_draft:
                      type: boolean
                    need_evaluation:
                      type: boolean
                    question_count:
                      type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

    post:
      tags: [Quizzes]
      summary: Создать квиз
      operationId: createQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Квиз по биологии
                description:
                  type: string
                  nullable: true
                default_settings:
                  $ref: "#/components/schemas/QuizDefaultSettings"
      responses:
        "200":
          description: Квиз создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/my:
    get:
      tags: [Quizzes]
      summary: Мои квизы
      operationId: listMyQuizzes
      responses:
        "200":
          description: Квизы текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    default_settings:
                      $ref: "#/components/schemas/QuizDefaultSettings"
                    is_public:
                      type: boolean
                    is_draft:
                      type: boolean
                    need_evaluation:
                      type: boolean
                    question_count:
                      type: integer
        "401": {$ref: "#/components/responses/Unauthorized"}

  /quizzes/{id}:
    get:
      tags: [Quizzes]
      summary: Получить квиз
      operationId: getQuiz
      description: |
        Поведение зависит от `role`:
        - **teacher** — полные данные с вопросами и правильными ответами. Только автор квиза.
        - **student** — краткое описание (без вопросов) + `library_test_session_id` для создания попытки.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [teacher, student]
      responses:
        "200":
          description: |
            Данные квиза. Структура зависит от `role`.
          content:
            application/json:
              schema:
                oneOf:
                  - title: Ответ для учителя
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      default_settings:
                        $ref: "#/components/schemas/QuizDefaultSettings"
                      is_public:
                        type: boolean
                      is_draft:
                        type: boolean
                      need_evaluation:
                        type: boolean
                      questions:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuestionForTeacher"
                  - title: Ответ для студента
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      default_settings:
                        $ref: "#/components/schemas/QuizStudentDefaultSettings"
                      question_count:
                        type: integer
                      library_test_session_id:
                        type: string
                        format: uuid
                        nullable: true
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    patch:
      tags: [Quizzes]
      summary: Обновить квиз
      operationId: updateQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Квиз обновлён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /quizzes/{id}/publish:
    post:
      tags: [Quizzes]
      summary: Опубликовать квиз
      operationId: publishQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_public
              properties:
                is_public:
                  type: boolean
                  description: |
                    true — квиз попадёт в публичную библиотеку (доступен студентам и другим учителям);
                    false — квиз опубликован, но виден только автору
      responses:
        "200":
          description: Квиз опубликован
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /quizzes/{id}/copy:
    post:
      tags: [Quizzes]
      summary: Скопировать опубликованный квиз
      operationId: copyQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Копия создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/{id}/questions:
    post:
      tags: [Questions]
      summary: Добавить вопрос
      operationId: addQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - text
                - answer_options
              properties:
                type:
                  type: string
                  enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
                text:
                  type: string
                  example: Какая столица Франции?
                image_link:
                  type: string
                  nullable: true
                max_score:
                  type: integer
                  default: 10
                metadata:
                  type: object
                  nullable: true
                  description: |
                    Обязательно для with_given_answer, drag, connection:
                    - with_given_answer: `{"correct_answers": ["Paris", "paris"]}`
                    - drag: `{"correct_order": ["B", "A", "C"]}`
                    - connection: `{"left": ["A","B"], "right": ["1","2"], "correct_pairs": {"A":"1","B":"2"}}`
                answer_options:
                  type: array
                  description: Обязательно для single_choice и multiple_choice
                  items:
                    type: object
                    required: [text]
                    properties:
                      text:
                        type: string
                      is_correct:
                        type: boolean
      responses:
        "200":
          description: Вопрос добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  order_index:
                    type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/{id}/questions/order:
    patch:
      tags: [Questions]
      summary: Изменить порядок вопросов
      operationId: reorderQuestions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Порядок обновлён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /quizzes/{id}/questions/{question_id}:
    delete:
      tags: [Questions]
      summary: Удалить вопрос
      operationId: deleteQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: question_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Вопрос удалён
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /sessions/{session_id}/attempts:
    post:
      tags: [Attempts]
      summary: Начать попытку
      operationId: createAttempt
      description: |
        Создаёт попытку и возвращает вопросы без правильных ответов.
        Порядок вопросов фиксируется на момент создания.
        Сессия должна быть в статусе `active`.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Попытка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionForStudent"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /attempts/{attempt_id}/answers:
    post:
      tags: [Attempts]
      summary: Отправить ответ
      operationId: submitAnswer
      description: |
        Upsert — повторный вызов с тем же `question_id` перезаписывает ответ.
        При истёкшем таймере попытка автозавершается, возвращает `ATTEMPT_EXPIRED`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, answer_data]
              properties:
                question_id:
                  type: string
                  format: uuid
                answer_data:
                  type: object
                  description: |
                    Зависит от типа вопроса:
                    - single_choice: `{"selected_option_id": "uuid"}`
                    - multiple_choice: `{"selected_option_ids": ["uuid1", "uuid2"]}`
                    - with_given_answer / with_free_answer: `{"text": "ответ"}`
                    - drag: `{"order": ["B", "A", "C"]}`
                    - connection: `{"pairs": {"A": "1", "B": "2"}}`
      responses:
        "200":
          description: Ответ сохранён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /attempts/{attempt_id}/finish:
    post:
      tags: [Attempts]
      summary: Завершить попытку
      operationId: finishAttempt
      description: |
        Запускает автооценку всех ответов.
        `with_free_answer` не оценивается автоматически — `final_score` останется `null`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Попытка завершена
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /attempts/{attempt_id}/result:
    get:
      tags: [Attempts]
      summary: Результат попытки
      operationId: getAttemptResult
      description: Доступен только после завершения попытки (status = completed).
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Результат попытки
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [in_progress, grading, graded, completed]
                  score:
                    type: number
                    format: float
                    nullable: true
                    description: Суммарный балл за попытку
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                    nullable: true
                  answers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnswerSubmissionResult"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
