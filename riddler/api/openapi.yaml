openapi: "3.0.3"
info:
  title: Edium Riddler
  version: "1.0.0"
servers:
  - url: /riddler/v1

security:
  - bearerAuth: []

tags:
  - name: Quizzes
    description: Управление квизами
  - name: Questions
    description: Управление вопросами квиза
  - name: Sessions
    description: Создание сессий прохождения (тест/лайв)
  - name: Attempts
    description: Прохождение квиза студентом
  - name: Teachers
    description: Проверка попыток учителем

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: QUIZ_NOT_FOUND
        description:
          type: string
          example: Квиз не найден
        details:
          type: object
          additionalProperties: true

    QuizDefaultSettings:
      type: object
      description: |
        Настройки квиза по умолчанию. Совпадают по составу с настройками сессии —
        при создании сессии можно переопределить любые поля, а недостающие берутся отсюда.
      properties:
        mode:
          type: string
          enum: [test, live]
          nullable: true
          description: Тип квиза — асинхронный (test) или синхронный (live)
          example: "test"
        total_time_limit_sec:
          type: integer
          nullable: true
          description: Лимит времени на весь тест (актуально для mode=test)
          example: 600
        question_time_limit_sec:
          type: integer
          nullable: true
          description: Лимит времени на вопрос (актуально для mode=live)
          example: 30
        shuffle_questions:
          type: boolean
          nullable: true
          example: true
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Дата открытия доступа (mode=test)
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Дедлайн сдачи (mode=test)

    QuizStudentDefaultSettings:
      type: object
      properties:
        total_time_limit_sec:
          type: integer
          nullable: true
          example: 600
        question_time_limit_sec:
          type: integer
          nullable: true
          example: 30

    AnswerOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        is_correct:
          type: boolean

    AnswerOptionForStudent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string

    QuestionForTeacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
        text:
          type: string
        image_link:
          type: string
          nullable: true
        order_index:
          type: integer
        max_score:
          type: integer
        metadata:
          type: object
          nullable: true
          description: |
            Зависит от типа вопроса:
            - with_given_answer: `{"correct_answers": ["Paris", "paris"]}`
            - drag: `{"correct_order": ["B", "A", "C"]}`
            - connection: `{"left": ["A","B"], "right": ["1","2"], "correct_pairs": {"A":"1","B":"2"}}`
        options:
          type: array
          items:
            $ref: "#/components/schemas/AnswerOption"

    QuestionForStudent:
      type: object
      description: |
        Вопрос для студента — без правильных ответов.
        - single_choice / multiple_choice: `options` без `is_correct`
        - drag: `metadata.items` — перемешанные элементы
        - connection: `metadata.left` + `metadata.right` (правая колонка перемешана)
        - with_given_answer / with_free_answer: нет `options`, нет `metadata`
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
        text:
          type: string
        image_link:
          type: string
          nullable: true
        max_score:
          type: integer
        options:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AnswerOptionForStudent"
        metadata:
          type: object
          nullable: true

    AttemptSummary:
      type: object
      properties:
        attempt_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress, grading, graded, completed]
        score:
          type: number
          format: float
          nullable: true

    AnswerReview:
      type: object
      properties:
        submission_id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        question_type:
          type: string
          enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
        question_text:
          type: string
        answer_data:
          type: object
          description: Ответ студента, формат зависит от типа вопроса
        final_score:
          type: number
          format: float
          nullable: true
        final_source:
          type: string
          nullable: true
          enum: [auto, llm, teacher]
        final_feedback:
          type: string
          nullable: true
        options:
          type: array
          description: Только для учителя — варианты ответа с правильными отметками
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              text:
                type: string
              is_correct:
                type: boolean
        metadata:
          type: object
          nullable: true
          description: Только для учителя — correct_answers / correct_order / correct_pairs

    AttemptReview:
      type: object
      properties:
        attempt_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress, grading, graded, completed]
        score:
          type: number
          format: float
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerReview"

    AnswerSubmissionResult:
      type: object
      properties:
        question_id:
          type: string
          format: uuid
        answer_data:
          type: object
          description: |
            Формат зависит от типа вопроса:
            - single_choice: `{"selected_option_id": "uuid"}`
            - multiple_choice: `{"selected_option_ids": ["uuid1", "uuid2"]}`
            - with_given_answer / with_free_answer: `{"text": "ответ"}`
            - drag: `{"order": ["B", "A", "C"]}`
            - connection: `{"pairs": {"A": "1", "B": "2"}}`
        final_score:
          type: number
          format: float
          nullable: true
          description: null для with_free_answer до ручной проверки
        final_source:
          type: string
          nullable: true
          enum: [auto, teacher, llm]
        final_feedback:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Нет прав
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
  /quizzes:
    get:
      tags: [Quizzes]
      summary: Список опубликованных квизов
      operationId: listQuizzes
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [teacher, student]
          description: |
            teacher — все опубликованные квизы;
            student — опубликованные публичные квизы без ручной проверки
      responses:
        "200":
          description: Список квизов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    default_settings:
                      $ref: "#/components/schemas/QuizDefaultSettings"
                    is_public:
                      type: boolean
                    source:
                      type: string
                      enum: [library, course]
                      description: library — создан из публичной библиотеки; course — создан для курса
                    need_evaluation:
                      type: boolean
                    question_count:
                      type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

    post:
      tags: [Quizzes]
      summary: Создать квиз
      operationId: createQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Квиз по биологии
                description:
                  type: string
                  nullable: true
                default_settings:
                  $ref: "#/components/schemas/QuizDefaultSettings"
                attach_to_course:
                  type: object
                  nullable: true
                  description: |
                    Если передан — после создания публикует событие `riddler.quiz_template.attached`,
                    по которому Caesar добавит шаблон в курс.
                  required: [course_id]
                  properties:
                    course_id:
                      type: string
                      format: uuid
                      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Квиз создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/my:
    get:
      tags: [Quizzes]
      summary: Мои квизы
      operationId: listMyQuizzes
      responses:
        "200":
          description: Квизы текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    description:
                      type: string
                      nullable: true
                    default_settings:
                      $ref: "#/components/schemas/QuizDefaultSettings"
                    is_public:
                      type: boolean
                    source:
                      type: string
                      enum: [library, course]
                    need_evaluation:
                      type: boolean
                    question_count:
                      type: integer
        "401": {$ref: "#/components/responses/Unauthorized"}

  /quizzes/{id}:
    get:
      tags: [Quizzes]
      summary: Получить квиз
      operationId: getQuiz
      description: |
        Поведение зависит от `role`:
        - **teacher** — полные данные с вопросами и правильными ответами. Только автор квиза.
        - **student** — краткое описание (без вопросов) + `library_test_session_id` для создания попытки.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: true
          schema:
            type: string
            enum: [teacher, student]
      responses:
        "200":
          description: |
            Данные квиза. Структура зависит от `role`.
          content:
            application/json:
              schema:
                oneOf:
                  - title: Ответ для учителя
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      default_settings:
                        $ref: "#/components/schemas/QuizDefaultSettings"
                      is_public:
                        type: boolean
                      source:
                        type: string
                        enum: [library, course]
                      need_evaluation:
                        type: boolean
                      questions:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuestionForTeacher"
                  - title: Ответ для студента
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      description:
                        type: string
                        nullable: true
                      default_settings:
                        $ref: "#/components/schemas/QuizStudentDefaultSettings"
                      question_count:
                        type: integer
                      library_test_session_id:
                        type: string
                        format: uuid
                        nullable: true
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    patch:
      tags: [Quizzes]
      summary: Обновить квиз
      operationId: updateQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                default_settings:
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/QuizDefaultSettings"
      responses:
        "200":
          description: Квиз обновлён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /quizzes/{id}/publish:
    post:
      tags: [Quizzes]
      summary: Опубликовать квиз
      operationId: publishQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      description: |
        Публикует квиз в публичную библиотеку (`is_public`). Доступно только для шаблонов с `source: library`;
        квизы курса (`source: course`) только в контексте курса и в библиотеку не публикуются.
      responses:
        "200":
          description: Квиз опубликован
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/{id}/copy:
    post:
      tags: [Quizzes]
      summary: Скопировать опубликованный квиз
      operationId: copyQuiz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                attach_to_course:
                  type: object
                  nullable: true
                  description: Если передан — копия сразу привязывается к курсу
                  required: [course_id]
                  properties:
                    course_id:
                      type: string
                      format: uuid
      responses:
        "200":
          description: Копия создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/{id}/questions:
    post:
      tags: [Questions]
      summary: Добавить вопрос
      operationId: addQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - text
                - answer_options
              properties:
                type:
                  type: string
                  enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
                text:
                  type: string
                  example: Какая столица Франции?
                image_link:
                  type: string
                  nullable: true
                max_score:
                  type: integer
                  default: 10
                metadata:
                  type: object
                  nullable: true
                  description: |
                    Обязательно для with_given_answer, drag, connection:
                    - with_given_answer: `{"correct_answers": ["Paris", "paris"]}`
                    - drag: `{"correct_order": ["B", "A", "C"]}`
                    - connection: `{"left": ["A","B"], "right": ["1","2"], "correct_pairs": {"A":"1","B":"2"}}`
                answer_options:
                  type: array
                  description: Обязательно для single_choice и multiple_choice
                  items:
                    type: object
                    required: [text]
                    properties:
                      text:
                        type: string
                      is_correct:
                        type: boolean
      responses:
        "200":
          description: Вопрос добавлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  order_index:
                    type: integer
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /quizzes/{id}/questions/order:
    patch:
      tags: [Questions]
      summary: Изменить порядок вопросов
      operationId: reorderQuestions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Порядок обновлён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /quizzes/{id}/questions/{question_id}:
    delete:
      tags: [Questions]
      summary: Удалить вопрос
      operationId: deleteQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: question_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Вопрос удалён
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /quizzes/{id}/generate:
    post:
      tags: [Questions]
      summary: Запустить генерацию вопросов по тексту
      operationId: generateQuestions
      description: |
        Отправляет текст в Sphinx (ML-сервис). Вопросы добавляются в квиз асинхронно.
        Вернёт `job_id` для отслеживания статуса (если нужно).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  description: Текст (параграф, статья), по которому Sphinx сгенерирует вопросы
      responses:
        "200":
          description: Задача принята
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /sessions/test:
    post:
      tags: [Sessions]
      summary: Создать тестовую сессию (для курса)
      operationId: createTestCourseSession
      description: |
        Основной таймер — `total_time_limit_sec` (время на весь квиз).
        Если не передан — берётся из `quiz.default_settings`, иначе `60 × количество_вопросов`.
        Публикует событие `riddler.course_session.created` → Caesar создаёт элемент курса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_template_id, module_id]
              properties:
                quiz_template_id:
                  type: string
                  format: uuid
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                module_id:
                  type: string
                  format: uuid
                  example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                total_time_limit_sec:
                  type: integer
                  nullable: true
                  description: Переопределяет настройку квиза
                  example: 600
                shuffle_questions:
                  type: boolean
                  nullable: true
                  description: Переопределяет настройку квиза
                  example: true
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Дата открытия доступа (RFC3339)
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Дедлайн сдачи (RFC3339)
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /sessions/{session_id}:
    delete:
      tags: [Sessions]
      summary: Отменить сессию курса
      operationId: deleteCourseSession
      description: |
        Удаляет сессию курса, если она ещё не была начата (нет попыток, live не запущен).
        Автоматически восстанавливает черновик шаблона квиза в курсе через событие.
        **Условия отмены:**
        - live-сессия: статус не `running`
        - test-сессия: нет ни одной попытки
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сессия удалена
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /sessions/test/inline:
    post:
      tags: [Sessions]
      summary: Создать квиз и тестовую сессию за один запрос (для курса)
      operationId: createTestCourseSessionInline
      description: |
        Атомарно создаёт шаблон квиза с `source=course`, добавляет вопросы и создаёт тестовую
        сессию. Предназначен для флоу «создать квиз прямо в курсе» без промежуточных запросов.
        Публикует события `riddler.quiz_template.attached` и `riddler.course_session.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, course_id, module_id, questions]
              properties:
                title:
                  type: string
                  example: "Тест по теме 1"
                description:
                  type: string
                  nullable: true
                course_id:
                  type: string
                  format: uuid
                module_id:
                  type: string
                  format: uuid
                questions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, text, answer_options]
                    properties:
                      type:
                        type: string
                        enum: [single_choice, multiple_choice, with_given_answer, with_free_answer, drag, connection]
                      text:
                        type: string
                      image_link:
                        type: string
                        nullable: true
                      metadata:
                        type: object
                        nullable: true
                      max_score:
                        type: integer
                        nullable: true
                      answer_options:
                        type: array
                        items:
                          type: object
                          required: [text, is_correct]
                          properties:
                            text:
                              type: string
                            is_correct:
                              type: boolean
                total_time_limit_sec:
                  type: integer
                  nullable: true
                  description: "Если не передан — 60 × кол-во вопросов"
                shuffle_questions:
                  type: boolean
                  nullable: true
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Дата открытия доступа (RFC3339)
                finished_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Дедлайн сдачи (RFC3339)
      responses:
        "200":
          description: Квиз и сессия созданы
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz_template_id:
                    type: string
                    format: uuid
                  session_id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /sessions/live:
    post:
      tags: [Sessions]
      summary: Создать live-сессию (для курса)
      operationId: createLiveCourseSession
      description: |
        Основной таймер — `question_time_limit_sec` (автопереход после N секунд на вопросе).
        Если не передан — берётся из `quiz.default_settings`, иначе 30 секунд.
        Shuffle и дедлайны не применимы — учитель управляет сессией вручную.
        Публикует событие `riddler.course_session.created` → Caesar создаёт элемент курса.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quiz_template_id, module_id]
              properties:
                quiz_template_id:
                  type: string
                  format: uuid
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                module_id:
                  type: string
                  format: uuid
                  example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                question_time_limit_sec:
                  type: integer
                  nullable: true
                  description: Переопределяет настройку квиза; дефолт 30 с
                  example: 45
      responses:
        "200":
          description: Сессия создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /sessions/{session_id}/attempts:
    post:
      tags: [Attempts]
      summary: Начать попытку
      operationId: createAttempt
      description: |
        Создаёт попытку и возвращает вопросы без правильных ответов.
        Порядок вопросов фиксируется на момент создания.
        Сессия должна быть в статусе `active`.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Попытка создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempt_id:
                    type: string
                    format: uuid
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionForStudent"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /attempts/{attempt_id}/answers:
    post:
      tags: [Attempts]
      summary: Отправить ответ
      operationId: submitAnswer
      description: |
        Upsert — повторный вызов с тем же `question_id` перезаписывает ответ.
        При истёкшем таймере попытка автозавершается, возвращает `ATTEMPT_EXPIRED`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, answer_data]
              properties:
                question_id:
                  type: string
                  format: uuid
                answer_data:
                  type: object
                  description: |
                    Зависит от типа вопроса:
                    - single_choice: `{"selected_option_id": "uuid"}`
                    - multiple_choice: `{"selected_option_ids": ["uuid1", "uuid2"]}`
                    - with_given_answer / with_free_answer: `{"text": "ответ"}`
                    - drag: `{"order": ["B", "A", "C"]}`
                    - connection: `{"pairs": {"A": "1", "B": "2"}}`
      responses:
        "200":
          description: Ответ сохранён
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /attempts/{attempt_id}/finish:
    post:
      tags: [Attempts]
      summary: Завершить попытку
      operationId: finishAttempt
      description: |
        Завершает попытку и запускает оценку.

        Поведение зависит от настройки квиза `need_evaluation`:
        - **false** — автооценка сразу, попытка переходит в `completed`. `with_free_answer` не оценивается автоматически.
        - **true** — автооценка вопросов с вариантами ответов, попытка переходит в `grading`. Свободные ответы уходят в Charon (LLM). После завершения всех LLM-оценок попытка переходит в `graded`. Учитель затем проверяет и завершает (`completed`).
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Попытка завершена
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    get:
      tags: [Teachers]
      summary: Список попыток сессии
      operationId: listSessionAttempts
      description: Только для учителя — автора квиза, к которому привязана сессия.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список попыток
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttemptSummary"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /attempts/{attempt_id}/review:
    get:
      tags: [Teachers]
      summary: Детали попытки с ответами и оценками
      operationId: getAttemptReview
      description: |
        Универсальный endpoint просмотра попытки.

        **Студент** (владелец попытки) — доступен при `status != in_progress`.
        Возвращает свои ответы, баллы и фидбек. Без правильных ответов (`options`, `metadata` отсутствуют).

        **Учитель** (автор квиза) — доступен в любой момент.
        Дополнительно возвращает `options` с `is_correct` и `metadata` с правильными ответами.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Детали попытки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptReview"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /attempts/{attempt_id}/submissions/{submission_id}/grade:
    post:
      tags: [Teachers]
      summary: Выставить оценку за ответ
      operationId: gradeSubmission
      description: |
        Учитель выставляет оценку за конкретный ответ студента.
        Перезаписывает auto/llm-оценку. Не отправляет итог в Caesar — для этого нужен `/complete`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: submission_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: number
                  format: float
                  minimum: 0
                  description: Балл от 0 до max_score вопроса
                feedback:
                  type: string
                  nullable: true
                  description: Текстовый комментарий к оценке
      responses:
        "200":
          description: Оценка сохранена
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}

  /attempts/{attempt_id}/complete:
    post:
      tags: [Teachers]
      summary: Завершить проверку попытки
      operationId: completeAttempt
      description: |
        Переводит попытку из `graded` в `completed`. Пересчитывает итоговый балл.
        Отправляет событие `riddler.attempt.scored` → Caesar обновляет оценку в курсе.
        Требует: попытка в статусе `graded`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Проверка завершена
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
